<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dhinchak TV</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body {
      background-color: #000000;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .loader {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255,255,255,0.1);
      border-top-color: #E50914;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 {
      font-size: 26px;
      font-weight: 900;
      color: #E50914;
      margin-bottom: 10px;
    }
    p { font-size: 14px; color: #808080; margin-bottom: 20px; }
    button {
      background: #E50914;
      color: #fff;
      border: none;
      padding: 12px 30px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 14px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="loader" id="spinner"></div>
  <h1>Dhinchak TV</h1>
  <p id="status-text">मूवीज़ लोड हो रही हैं...</p>
  <button id="retry-btn" onclick="startApp()">Retry</button>

  <script>
    function startApp() {
      if (navigator.onLine) {
        window.location.replace("https://dhinchaktv.pages.dev/user.html");
      } else {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('status-text').innerText = 'इंटरनेट बंद है! कृपया इंटरनेट चालू करके Retry दबाएं।';
        document.getElementById('retry-btn').style.display = 'inline-block';
      }
    }
    window.onload = startApp;
  </script>
</body>
</html>
